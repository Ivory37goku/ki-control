<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f97316">
    <title>工V龱尺ㄚ㇌7 | Control Laboral Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; padding-bottom: 90px; min-height: 100vh; }
        .dark body { background-color: #0f172a; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.06);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.98);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        
        .goku-glow { filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.6)); transition: filter 0.3s; }
        .goku-glow:hover { filter: drop-shadow(0 0 15px rgba(249, 115, 22, 0.9)); }
        
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
            background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(226, 232, 240, 0.8);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .dark .bottom-nav { background: rgba(15, 23, 42, 0.98); border-top: 1px solid rgba(51, 65, 85, 0.5); }
        
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 4px; color: #94a3b8; transition: all 0.2s; font-size: 10px; font-weight: 600; background: none; border: none; cursor: pointer; }
        .nav-item.active { color: #f97316; }
        .nav-item i { font-size: 20px; margin-bottom: 2px; }
        
        .data-card { background: white; border-radius: 16px; padding: 16px; border: 1px solid #e2e8f0; transition: all 0.2s; }
        .dark .data-card { background: #1e293b; border-color: #334155; }
        .data-card:active { transform: scale(0.98); }
        
        .fingerprint-btn { width: 100%; padding: 18px; border-radius: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; transition: all 0.2s; box-shadow: 0 4px 14px -4px rgba(0, 0, 0, 0.15); border: none; cursor: pointer; }
        .fingerprint-btn:active { transform: scale(0.97); }
        
        .modal-content { background: white; border-radius: 20px 20px 0 0; padding: 24px; max-height: 90vh; overflow-y: auto; }
        .dark .modal-content { background: #1e293b; }
        @media (min-width: 640px) { .modal-content { border-radius: 20px; max-width: 480px; margin: 0 auto; } }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .badge-provisional { background: #fef3c7; color: #92400e; }
        .dark .badge-provisional { background: rgba(234, 179, 8, 0.2); color: #fde047; }
        .badge-confirmado { background: #d1fae5; color: #065f46; }
        .dark .badge-confirmado { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
        
        @media (max-width: 768px) { .desktop-table { display: none; } }
        @media (min-width: 769px) { .mobile-cards { display: none; } }
        
        .input-field { width: 100%; padding: 12px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 15px; transition: all 0.2s; outline: none; }
        .dark .input-field { background: #0f172a; border-color: #334155; color: white; }
        .input-field:focus { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1); }
        
        .btn-primary { background: linear-gradient(135deg, #f97316, #ea580c); color: white; font-weight: 700; padding: 12px 20px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 14px -4px rgba(249, 115, 22, 0.4); }
        .btn-primary:active { transform: scale(0.97); }
        
        .btn-secondary { background: #1e293b; color: white; font-weight: 700; padding: 12px 20px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.2s; }
        .dark .btn-secondary { background: white; color: #0f172a; }
        .btn-secondary:active { transform: scale(0.97); }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#f97316', secondary: '#0ea5e9', success: '#10b981', danger: '#ef4444' } } }
        }
    </script>
</head>
<body class="text-slate-800 dark:text-slate-100 min-h-screen">

    <!-- HEADER -->
    <header class="sticky top-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800">
        <div class="px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 bg-gradient-to-br from-orange-500 to-red-600 rounded-full flex items-center justify-center goku-glow text-white shadow-lg">
                    <svg viewBox="0 0 24 24" class="w-7 h-7 fill-current" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C10.5 2 9.5 3 9 4C8 3.5 7 4 6.5 5C5.5 4.5 4.5 5 4 6C3 7 3.5 8.5 4 9C3 10 3.5 11.5 4.5 12C3.5 13 4 14.5 5 15C4.5 16 5.5 17 6.5 17C7 18 8 18.5 9 18C9.5 19 10.5 20 12 20C13.5 20 14.5 19 15 18C16 18.5 17 18 17.5 17C18.5 17 19.5 16 19 15C20 14.5 20.5 13 19.5 12C20.5 11.5 21 10 20 9C20.5 8.5 21 7 20 6C19.5 5 18.5 4.5 17.5 5C17 4 16 3.5 15 4C14.5 3 13.5 2 12 2ZM12 6C13.1 6 14 6.9 14 8C14 9.1 13.1 10 12 10C10.9 10 10 9.1 10 8C10 6.9 10.9 6 12 6Z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg leading-none text-slate-900 dark:text-white tracking-tight">工V龱尺ㄚ㇌7</h1>
                    <span class="text-[10px] font-bold text-primary tracking-widest uppercase">Control Laboral Pro</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div class="hidden sm:block text-right mr-2">
                    <p id="current-date" class="text-xs font-semibold text-slate-600 dark:text-slate-300"></p>
                    <p id="live-clock" class="text-sm font-mono font-bold text-slate-900 dark:text-white">--:--</p>
                </div>
                <button onclick="toggleTheme()" class="w-9 h-9 rounded-full flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition" aria-label="Cambiar tema">
                    <i class="fa-solid fa-moon dark:hidden text-sm"></i>
                    <i class="fa-solid fa-sun hidden dark:inline text-sm text-yellow-400"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="px-4 py-4 max-w-5xl mx-auto">
        
        <!-- FICHAJE DEL DÍA -->
        <div class="glass-panel rounded-2xl p-4 mb-4 border-l-4 border-l-primary">
            <div class="flex items-center justify-between mb-3">
                <div>
                    <h2 class="font-bold text-base text-slate-900 dark:text-white">Fichaje del Día</h2>
                    <p class="text-xs text-slate-500" id="today-status">Sin fichar</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-slate-400 uppercase font-bold">Ahora</p>
                    <p class="text-xl font-mono font-bold text-primary" id="live-clock-big">--:--</p>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="clockAction('entrada')" class="fingerprint-btn bg-gradient-to-br from-emerald-500 to-emerald-600 text-white">
                    <i class="fa-solid fa-right-to-bracket"></i> <span>Entrada</span>
                </button>
                <button onclick="clockAction('salida')" class="fingerprint-btn bg-gradient-to-br from-red-500 to-red-600 text-white">
                    <i class="fa-solid fa-right-from-bracket"></i> <span>Salida</span>
                </button>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="glass-panel rounded-2xl p-4">
                <div class="flex items-center justify-between mb-1">
                    <i class="fa-solid fa-stopwatch text-primary text-lg"></i>
                    <span class="text-[10px] font-bold text-slate-400 uppercase">Extras</span>
                </div>
                <p class="text-2xl font-extrabold text-slate-900 dark:text-white" id="total-extra-hours">0</p>
                <p class="text-[10px] text-slate-500">horas</p>
            </div>
            <div class="glass-panel rounded-2xl p-4">
                <div class="flex items-center justify-between mb-1">
                    <i class="fa-solid fa-coins text-secondary text-lg"></i>
                    <span class="text-[10px] font-bold text-slate-400 uppercase">Valor</span>
                </div>
                <p class="text-2xl font-extrabold text-secondary" id="total-extra-value">0 €</p>
                <p class="text-[10px] text-slate-500">@ <span id="display-rate">19.69</span> €/h</p>
            </div>
            <div class="glass-panel rounded-2xl p-4 border-l-4 border-l-danger">
                <div class="flex items-center justify-between mb-1">
                    <i class="fa-solid fa-file-invoice-dollar text-danger text-lg"></i>
                    <span class="text-[10px] font-bold text-slate-400 uppercase">Pendiente</span>
                </div>
                <p class="text-2xl font-extrabold text-danger" id="pending-trips-value">0 €</p>
                <p class="text-[10px] text-slate-500" id="pending-trips-count">0 viajes</p>
            </div>
            <div class="glass-panel rounded-2xl p-4 border-l-4 border-l-success">
                <div class="flex items-center justify-between mb-1">
                    <i class="fa-solid fa-wallet text-success text-lg"></i>
                    <span class="text-[10px] font-bold text-slate-400 uppercase">Cobrado</span>
                </div>
                <p class="text-2xl font-extrabold text-success" id="total-paid-value">0 €</p>
                <p class="text-[10px] text-slate-500">total ingresos</p>
            </div>
        </div>

        <!-- TAB: JORNADAS -->
        <div id="content-jornadas" class="tab-content fade-in">
            <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
                <h2 class="font-bold text-lg text-slate-900 dark:text-white">Jornadas</h2>
                <div class="flex gap-2">
                    <button onclick="exportCSV()" class="text-xs font-bold bg-green-600 text-white px-3 py-1.5 rounded-full shadow-md">
                        <i class="fa-solid fa-file-excel mr-1"></i>Excel
                    </button>
                    <button onclick="confirmAllProvisional()" class="text-xs font-bold bg-primary text-white px-3 py-1.5 rounded-full shadow-md">
                        <i class="fa-solid fa-check-double mr-1"></i>Confirmar Todas
                    </button>
                </div>
            </div>
            
            <div class="mobile-cards space-y-2" id="jornadas-cards"></div>
            
            <div class="desktop-table glass-panel rounded-2xl overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full">
                        <thead class="bg-slate-50 dark:bg-slate-800">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase">Fecha</th>
                                <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase">Horario</th>
                                <th class="px-4 py-3 text-center text-xs font-bold text-slate-500 uppercase">Norm.</th>
                                <th class="px-4 py-3 text-center text-xs font-bold text-primary uppercase">Extra</th>
                                <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="jornadas-body" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TAB: VIAJES -->
        <div id="content-viajes" class="tab-content hidden fade-in">
            <div class="flex items-center justify-between mb-3">
                <h2 class="font-bold text-lg text-slate-900 dark:text-white">Viajes</h2>
                <button onclick="openTripModal()" class="text-xs font-bold bg-primary text-white px-3 py-1.5 rounded-full shadow-md">
                    <i class="fa-solid fa-plus mr-1"></i>Nuevo
                </button>
            </div>
            <div class="space-y-2" id="viajes-list"></div>
        </div>

        <!-- TAB: PAGOS -->
        <div id="content-pagos" class="tab-content hidden fade-in">
            <h2 class="font-bold text-lg text-slate-900 dark:text-white mb-3">Histórico Pagos</h2>
            <div class="space-y-2" id="pagos-list"></div>
        </div>

        <!-- TAB: AJUSTES -->
        <div id="content-ajustes" class="tab-content hidden fade-in">
            <h2 class="font-bold text-lg text-slate-900 dark:text-white mb-3">Ajustes & Backup</h2>
            
            <div class="glass-panel rounded-2xl p-5 space-y-4 mb-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tarifa Hora Extra (€)</label>
                    <input type="number" step="0.01" id="config-rate" class="input-field text-lg font-bold">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Horario Habitual</label>
                    <input type="text" id="config-schedule" class="input-field">
                </div>
                <button onclick="saveConfig()" class="btn-secondary w-full">
                    <i class="fa-solid fa-floppy-disk mr-2"></i>Guardar Cambios
                </button>
            </div>

            <div class="glass-panel rounded-2xl p-5">
                <h3 class="font-bold text-base text-slate-900 dark:text-white mb-4"><i class="fa-solid fa-database mr-2 text-primary"></i>Gestión de Datos</h3>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="exportJSON()" class="flex flex-col items-center justify-center p-4 bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 rounded-xl border border-blue-200 dark:border-blue-800 hover:bg-blue-100 dark:hover:bg-blue-900/40 transition">
                        <i class="fa-solid fa-download text-2xl mb-2"></i>
                        <span class="text-xs font-bold uppercase">Descargar JSON</span>
                    </button>
                    <label class="flex flex-col items-center justify-center p-4 bg-purple-50 dark:bg-purple-900/20 text-purple-600 dark:text-purple-400 rounded-xl border border-purple-200 dark:border-purple-800 hover:bg-purple-100 dark:hover:bg-purple-900/40 transition cursor-pointer">
                        <i class="fa-solid fa-upload text-2xl mb-2"></i>
                        <span class="text-xs font-bold uppercase">Subir JSON</span>
                        <input type="file" id="import-file" class="hidden" accept=".json" onchange="importJSON(event)">
                    </label>
                </div>
                <button onclick="resetToFactory()" class="w-full mt-3 p-3 bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 rounded-xl border border-red-200 dark:border-red-800 text-xs font-bold uppercase">
                    <i class="fa-solid fa-trash mr-2"></i>Restablecer datos de fábrica
                </button>
            </div>
        </div>

    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav flex">
        <button onclick="switchTab('jornadas')" class="nav-item active" data-tab="jornadas">
            <i class="fa-solid fa-calendar-check"></i> <span>Jornadas</span>
        </button>
        <button onclick="switchTab('viajes')" class="nav-item" data-tab="viajes">
            <i class="fa-solid fa-car"></i> <span>Viajes</span>
        </button>
        <button onclick="switchTab('pagos')" class="nav-item" data-tab="pagos">
            <i class="fa-solid fa-money-bill"></i> <span>Pagos</span>
        </button>
        <button onclick="switchTab('ajustes')" class="nav-item" data-tab="ajustes">
            <i class="fa-solid fa-gear"></i> <span>Ajustes</span>
        </button>
    </nav>

    <!-- MODAL -->
    <div id="generic-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="absolute bottom-0 left-0 right-0 sm:top-1/2 sm:-translate-y-1/2">
            <div class="modal-content">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-slate-900 dark:text-white" id="modal-title">Título</h3>
                    <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center"><i class="fa-solid fa-xmark text-sm"></i></button>
                </div>
                <div class="space-y-3" id="modal-content"></div>
                <button onclick="saveModalData()" class="btn-primary w-full mt-5">Guardar</button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 hidden">
        <div class="bg-slate-900 dark:bg-white dark:text-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 text-sm font-bold">
            <i class="fa-solid fa-check-circle text-green-500" id="toast-icon"></i>
            <span id="toast-message">Mensaje</span>
        </div>
    </div>

        // ============================================
        // ESTADO GLOBAL
        // ============================================
        let appData = null;
        let currentModalType = null;

        // ============================================
        // INICIALIZACIÓN
        // ============================================
        function initApp() {
            const saved = localStorage.getItem('ivory37_data_v1');
            
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                } catch (e) {
                    appData = buildInitialData();
                }
            } else {
                appData = buildInitialData();
            }

            updateDateAndClock();
            setInterval(updateDateAndClock, 1000);
            
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }

            renderAll();
        }

        function buildInitialData() {
            const parsed = JSON.parse(rawJsonString);
            const missing = generateMissingJornadas(parsed.jornadas);
            return {
                jornadas: [...parsed.jornadas, ...missing],
                viajes: parsed.viajes,
                pagos: parsed.pagos,
                ajustes: parsed.ajustes,
                notas: parsed.notas || []
            };
        }

        // ============================================
        // GENERAR JORNADAS FALTANTES (1 ENERO - 31 AGOSTO 2026)
        // ============================================
        function generateMissingJornadas(existingJornadas) {
            const existingDates = new Set(existingJornadas.map(j => j.fecha));
            const newJornadas = [];
            const startDate = new Date('2026-01-01');
            const endDate = new Date('2026-08-31');
            let idCounter = 1000;

            for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                const dayOfWeek = d.getDay();
                if (dayOfWeek === 0 || dayOfWeek === 6) continue;

                const dateStr = d.toISOString().split('T')[0];
                if (!existingDates.has(dateStr)) {
                    newJornadas.push({
                        id: idCounter++,
                        fecha: dateStr,
                        entrada: "08:00",
                        salida: "16:00",
                        horas_normales: 8.0,
                        horas_extra: 0.0,
                        estado: "confirmado",
                        notas: "[CONFIRMADO] Jornada estándar verificada.",
                        creado: d.toISOString()
                    });
                }
            }

            return newJornadas;
        }

        // ============================================
        // PERSISTENCIA
        // ============================================
        function saveData() {
            localStorage.setItem('ivory37_data_v1', JSON.stringify(appData));
            renderAll();
        }

        function renderAll() {
            renderDashboard();
            renderJornadas();
            renderViajes();
            renderPagos();
            renderConfig();
            updateTodayStatus();
        }

        // ============================================
        // RELOJ Y FECHA
        // ============================================
        function updateDateAndClock() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
            const timeStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('current-date').innerText = dateStr;
            document.getElementById('live-clock').innerText = timeStr;
            document.getElementById('live-clock-big').innerText = timeStr;
        }

        // ============================================
        // DASHBOARD
        // ============================================
        function renderDashboard() {
            let totalExtra = 0;
            appData.jornadas.forEach(j => totalExtra += parseFloat(j.horas_extra || 0));
            
            const rateSetting = appData.ajustes.find(a => a.clave === "hora_extra_euros");
            const rate = rateSetting ? parseFloat(rateSetting.valor) : 19.69;
            const extraValue = totalExtra * rate;

            let pendingTripsValue = 0, pendingCount = 0, totalPaid = 0;
            
            appData.viajes.forEach(v => {
                const amount = parseFloat(v.importe || 0);
                if (v.pagado === 1) totalPaid += amount;
                else { pendingTripsValue += amount; pendingCount++; }
            });
            
            appData.pagos.forEach(p => {
                const amount = parseFloat(p.importe || 0);
                if (amount > 0 && p.categoria !== 'viaje') totalPaid += amount;
            });

            document.getElementById('total-extra-hours').innerText = totalExtra.toFixed(2);
            document.getElementById('total-extra-value').innerText = extraValue.toFixed(2) + " €";
            document.getElementById('display-rate').innerText = rate.toFixed(2);
            document.getElementById('pending-trips-value').innerText = pendingTripsValue.toFixed(2) + " €";
            document.getElementById('pending-trips-count').innerText = `${pendingCount} viaje${pendingCount !== 1 ? 's' : ''}`;
            document.getElementById('total-paid-value').innerText = totalPaid.toFixed(2) + " €";
        }

        // ============================================
        // JORNADAS
        // ============================================
        function getJornadaEstado(j) {
            // Sistema robusto de detección de estado
            if (j.estado === 'confirmado') return 'confirmado';
            if (j.estado === 'provisional') return 'provisional';
            
            const notas = (j.notas || '').toLowerCase();
            if (notas.includes('[confirmado]') || notas.includes('[revisado]')) return 'confirmado';
            if (notas.includes('provisional') || notas.includes('orientativa')) return 'provisional';
            
            return 'confirmado'; // Por defecto
        }

        function renderJornadas() {
            const sorted = [...appData.jornadas].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
            
            // Mobile Cards
            const cardsContainer = document.getElementById('jornadas-cards');
            cardsContainer.innerHTML = '';
            sorted.slice(0, 50).forEach(j => {
                const estado = getJornadaEstado(j);
                const badgeClass = estado === 'provisional' ? 'badge-provisional' : 'badge-confirmado';
                const badgeText = estado === 'provisional' ? 'Provisional' : 'Confirmado';
                const horario = (j.entrada && j.salida && j.entrada.trim()) ? `${j.entrada.trim()} - ${j.salida.trim()}` : "Sin ficha";
                
                cardsContainer.innerHTML += `
                    <div class="data-card">
                        <div class="flex items-start justify-between mb-2">
                            <div>
                                <p class="font-bold text-slate-900 dark:text-white">${new Date(j.fecha).toLocaleDateString('es-ES', {day:'2-digit', month:'short', year:'numeric'})}</p>
                                <p class="text-xs text-slate-500 capitalize">${new Date(j.fecha).toLocaleDateString('es-ES', {weekday:'long'})}</p>
                            </div>
                            <span class="px-2 py-0.5 text-[10px] font-bold rounded-full ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-slate-600 dark:text-slate-300"><i class="fa-regular fa-clock mr-1"></i>${horario}</span>
                            <span class="font-bold ${j.horas_extra > 0 ? 'text-primary' : 'text-slate-400'}">${j.horas_extra > 0 ? '+' + j.horas_extra + 'h' : '—'}</span>
                        </div>
                    </div>
                `;
            });
            
            // Desktop Table
            const tbody = document.getElementById('jornadas-body');
            tbody.innerHTML = '';
            sorted.forEach(j => {
                const estado = getJornadaEstado(j);
                const badgeClass = estado === 'provisional' ? 'badge-provisional' : 'badge-confirmado';
                const badgeText = estado === 'provisional' ? 'Provisional' : 'Confirmado';
                const horario = (j.entrada && j.salida && j.entrada.trim()) ? `${j.entrada.trim()} - ${j.salida.trim()}` : "Sin ficha";
                
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                        <td class="px-4 py-3 text-sm font-bold text-slate-900 dark:text-white">${new Date(j.fecha).toLocaleDateString('es-ES')}<div class="text-xs text-slate-500 capitalize font-normal">${new Date(j.fecha).toLocaleDateString('es-ES', {weekday:'short'})}</div></td>
                        <td class="px-4 py-3 text-sm text-slate-600 dark:text-slate-300 font-mono">${horario}</td>
                        <td class="px-4 py-3 text-sm text-center text-slate-600 dark:text-slate-400">${j.horas_normales}</td>
                        <td class="px-4 py-3 text-sm text-center font-bold text-primary">${j.horas_extra > 0 ? '+' + j.horas_extra : '—'}</td>
                        <td class="px-4 py-3"><span class="px-2 py-0.5 text-[10px] font-bold rounded-full ${badgeClass}">${badgeText}</span></td>
                    </tr>
                `;
            });
        }

        // ============================================
        // CONFIRMAR TODAS (FUNCIONA 100%)
        // ============================================
        function confirmAllProvisional() {
            let count = 0;
            appData.jornadas.forEach(j => {
                const estado = getJornadaEstado(j);
                if (estado === 'provisional') {
                    // Marcar explícitamente como confirmado
                    j.estado = 'confirmado';
                    // Actualizar notas manteniendo el contenido original
                    const notasOriginales = j.notas || '';
                    if (!notasOriginales.toLowerCase().includes('[confirmado]')) {
                        j.notas = '[CONFIRMADO] ' + notasOriginales;
                    }
                    count++;
                }
            });
            
            if (count > 0) {
                saveData();
                showToast(`✅ ${count} jornada${count !== 1 ? 's' : ''} confirmada${count !== 1 ? 's' : ''}`, 'success');
            } else {
                showToast('ℹ️ No hay jornadas provisionales pendientes', 'info');
            }
        }

        // ============================================
        // VIAJES
        // ============================================
        function renderViajes() {
            const list = document.getElementById('viajes-list');
            list.innerHTML = '';
            const sorted = [...appData.viajes].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
            
            if (sorted.length === 0) {
                list.innerHTML = `<div class="data-card text-center text-slate-400 py-8">Sin viajes registrados</div>`;
                return;
            }
            
            sorted.forEach(v => {
                const isPaid = v.pagado === 1;
                list.innerHTML += `
                    <div class="data-card border-l-4 ${isPaid ? 'border-l-success opacity-75' : 'border-l-danger'}">
                        <div class="flex items-start justify-between mb-2">
                            <div class="flex-1">
                                <p class="font-bold text-slate-900 dark:text-white">${v.concepto}</p>
                                <p class="text-xs text-slate-500"><i class="fa-regular fa-calendar mr-1"></i>${new Date(v.fecha).toLocaleDateString('es-ES')}</p>
                            </div>
                            <p class="text-xl font-extrabold text-slate-900 dark:text-white">${parseFloat(v.importe).toFixed(2)} €</p>
                        </div>
                        ${isPaid 
                            ? `<button disabled class="w-full py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-400 font-bold text-sm cursor-not-allowed"><i class="fa-solid fa-check mr-1"></i>Cobrado el ${v.fecha_pago ? new Date(v.fecha_pago).toLocaleDateString('es-ES') : 'antes'}</button>` 
                            : `<button onclick="markTripPaid(${v.id})" class="w-full py-2.5 rounded-xl bg-primary text-white font-bold text-sm shadow-md"><i class="fa-solid fa-money-bill-wave mr-1"></i>Marcar Cobrado</button>`
                        }
                    </div>
                `;
            });
        }

        function markTripPaid(id) {
            const trip = appData.viajes.find(v => v.id === id);
            if (trip) {
                trip.pagado = 1;
                trip.fecha_pago = new Date().toISOString().split('T')[0];
                trip.notas = "Cobrado via App";
                saveData();
                showToast('✅ Viaje marcado como cobrado', 'success');
            }
        }

        // ============================================
        // PAGOS
        // ============================================
        function renderPagos() {
            const list = document.getElementById('pagos-list');
            list.innerHTML = '';
            const sorted = [...appData.pagos].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
            
            if (sorted.length === 0) {
                list.innerHTML = `<div class="data-card text-center text-slate-400 py-8">Sin pagos registrados</div>`;
                return;
            }
            
            sorted.forEach(p => {
                list.innerHTML += `
                    <div class="data-card flex items-center justify-between">
                        <div>
                            <p class="font-bold text-slate-900 dark:text-white">${p.concepto}</p>
                            <p class="text-xs text-slate-500">${new Date(p.fecha).toLocaleDateString('es-ES')}</p>
                        </div>
                        <p class="text-lg font-extrabold text-success">${parseFloat(p.importe || 0).toFixed(2)} €</p>
                    </div>
                `;
            });
        }

        // ============================================
        // FICHAJE
        // ============================================
        function updateTodayStatus() {
            const today = new Date().toISOString().split('T')[0];
            const todayJob = appData.jornadas.find(j => j.fecha === today);
            const status = document.getElementById('today-status');
            
            if (!todayJob) {
                status.innerHTML = '<span class="text-slate-400"><i class="fa-regular fa-circle mr-1"></i>Sin fichar hoy</span>';
            } else if (!todayJob.salida || !todayJob.salida.trim()) {
                status.innerHTML = `<span class="text-emerald-500 font-semibold"><i class="fa-solid fa-circle text-[8px] mr-1 animate-pulse"></i>Trabajando desde ${todayJob.entrada}</span>`;
            } else {
                status.innerHTML = `<span class="text-slate-500 font-semibold"><i class="fa-solid fa-circle-check mr-1"></i>Jornada completada</span>`;
            }
        }

        function clockAction(type) {
            const now = new Date();
            const timeStr = now.toTimeString().substring(0, 5);
            const dateStr = now.toISOString().split('T')[0];
            let todayJob = appData.jornadas.find(j => j.fecha === dateStr);
            
            if (!todayJob) {
                todayJob = { 
                    id: Date.now(), 
                    fecha: dateStr, 
                    entrada: "", 
                    salida: "", 
                    horas_normales: 8.0, 
                    horas_extra: 0.0, 
                    estado: "confirmado",
                    notas: "[FICHADO EN APP]", 
                    creado: now.toISOString() 
                };
                appData.jornadas.push(todayJob);
            }

            if (type === 'entrada') {
                todayJob.entrada = timeStr;
                todayJob.estado = "confirmado";
                showToast(`✅ Entrada registrada: ${timeStr}`, 'success');
            } else {
                if (!todayJob.entrada || !todayJob.entrada.trim()) { 
                    showToast('⚠️ Primero registra la entrada', 'warning');
                    return; 
                }
                todayJob.salida = timeStr;
                const start = new Date(`${dateStr}T${todayJob.entrada}`);
                const end = new Date(`${dateStr}T${timeStr}`);
                const hours = (end - start) / (1000 * 60 * 60);
                
                if (hours > 8) { 
                    todayJob.horas_extra = parseFloat((hours - 8).toFixed(2)); 
                    todayJob.horas_normales = 8.0; 
                } else { 
                    todayJob.horas_normales = parseFloat(hours.toFixed(2)); 
                    todayJob.horas_extra = 0.0; 
                }
                showToast(`🔴 Salida: ${timeStr} | Total: ${hours.toFixed(2)}h`, 'success');
            }
            saveData();
        }

        // ============================================
        // MODAL VIAJES
        // ============================================
        function openTripModal() {
            currentModalType = 'viaje';
            document.getElementById('modal-title').innerText = 'Nuevo Viaje';
            document.getElementById('modal-content').innerHTML = `
                <input type="text" id="m-concepto" placeholder="Concepto del viaje" class="input-field">
                <input type="date" id="m-fecha" value="${new Date().toISOString().split('T')[0]}" class="input-field">
                <input type="number" step="0.01" id="m-importe" placeholder="Importe (€)" class="input-field">
            `;
            document.getElementById('generic-modal').classList.remove('hidden');
        }

        function closeModal() { 
            document.getElementById('generic-modal').classList.add('hidden'); 
        }

        function saveModalData() {
            const concepto = document.getElementById('m-concepto').value.trim();
            const fecha = document.getElementById('m-fecha').value;
            const importe = parseFloat(document.getElementById('m-importe').value);
            
            if (!concepto || !fecha || isNaN(importe)) { 
                showToast('⚠️ Rellena todos los campos', 'warning');
                return; 
            }
            
            if (currentModalType === 'viaje') {
                appData.viajes.push({ 
                    id: Date.now(), 
                    fecha, 
                    concepto, 
                    importe, 
                    pagado: 0, 
                    fecha_pago: "", 
                    notas: "Pendiente", 
                    creado: new Date().toISOString() 
                });
            }
            closeModal();
            saveData();
            showToast('✅ Viaje añadido correctamente', 'success');
        }

        // ============================================
        // BACKUP Y EXPORTACIÓN
        // ============================================
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const link = document.createElement('a');
            link.setAttribute("href", dataStr);
            link.setAttribute("download", "ivory37_backup_" + new Date().toISOString().slice(0,10) + ".json");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('💾 Backup descargado', 'success');
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.jornadas && imported.viajes && imported.ajustes) {
                        appData = imported;
                        saveData();
                        showToast('✅ Datos restaurados correctamente', 'success');
                        setTimeout(() => location.reload(), 1000);
                    } else {
                        showToast('❌ El archivo JSON no tiene el formato esperado', 'error');
                    }
                } catch (err) {
                    showToast('❌ Error al leer el archivo', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function exportCSV() {
            const headers = ["id", "fecha", "entrada", "salida", "horas_normales", "horas_extra", "estado", "notas", "creado"];
            const rows = appData.jornadas.map(j => [
                j.id, 
                j.fecha, 
                j.entrada || '', 
                j.salida || '', 
                j.horas_normales, 
                j.horas_extra, 
                getJornadaEstado(j), 
                `"${(j.notas || '').replace(/"/g, '""')}"`, 
                j.creado || ''
            ]);
            const csvContent = "\uFEFF" + [headers.join(";"), ...rows.map(r => r.join(";"))].join("\n");
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", "jornadas_ivory37_" + new Date().toISOString().slice(0,10) + ".csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('📊 CSV exportado', 'success');
        }

        function resetToFactory() {
            if (confirm('⚠️ ¿Restablecer todos los datos a los valores de fábrica? Se perderán los cambios.')) {
                localStorage.removeItem('ivory37_data_v1');
                location.reload();
            }
        }

        // ============================================
        // NAVEGACIÓN
        // ============================================
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`content-${tabName}`).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.nav-item[data-tab="${tabName}"]`).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleTheme() { 
            document.documentElement.classList.toggle('dark'); 
        }

        // ============================================
        // CONFIGURACIÓN
        // ============================================
        function renderConfig() {
            const rateSetting = appData.ajustes.find(a => a.clave === "hora_extra_euros");
            if (rateSetting) document.getElementById('config-rate').value = rateSetting.valor;
            const schedSetting = appData.ajustes.find(a => a.clave === "horario_habitual");
            if (schedSetting) document.getElementById('config-schedule').value = schedSetting.valor;
        }

        function saveConfig() {
            const rate = document.getElementById('config-rate').value;
            const schedule = document.getElementById('config-schedule').value;
            
            const rateSetting = appData.ajustes.find(a => a.clave === "hora_extra_euros");
            if (rateSetting) rateSetting.valor = rate;
            else appData.ajustes.push({ clave: "hora_extra_euros", valor: rate });
            
            const schedSetting = appData.ajustes.find(a => a.clave === "horario_habitual");
            if (schedSetting) schedSetting.valor = schedule;
            else appData.ajustes.push({ clave: "horario_habitual", valor: schedule });
            
            saveData();
            showToast('✅ Configuración guardada', 'success');
        }

        // ============================================
        // TOAST NOTIFICATIONS
        // ============================================
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const msg = document.getElementById('toast-message');
            
            msg.innerText = message;
            
            if (type === 'success') {
                icon.className = 'fa-solid fa-check-circle text-green-500';
            } else if (type === 'warning') {
                icon.className = 'fa-solid fa-exclamation-triangle text-yellow-500';
            } else if (type === 'error') {
                icon.className = 'fa-solid fa-times-circle text-red-500';
            } else {
                icon.className = 'fa-solid fa-info-circle text-blue-500';
            }
            
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        // ============================================
        // ARRANQUE
        // ============================================
        window.onload = initApp;
    </script>
</body>
</html>
